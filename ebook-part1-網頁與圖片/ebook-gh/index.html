<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mnanak na qalang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Josefin+Sans:wght@400;600&display=swap">
<style>
/* Layout: full-screen picture book. One illustration per page on a bark-brown ground, spear arrows at the sides, slim footer with page count, progress and audio controls. */
:root {
  --ground: #1d0f0c;
  --ground-2: #2b1814;
  --ink: #f3e6cf;
  --ink-dim: #b9a58a;
  --ember: #e0a03a;
  --line: #5a2f26;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-ui: "Josefin Sans", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  overflow: hidden;
}
.book { height: 100%; display: grid; grid-template-rows: 1fr auto; gap: 10px; min-width: 0; }
.stage { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 0; }
.nav { background: none; border: 0; padding: 14px 6px; cursor: pointer; opacity: .85; transition: opacity .2s, transform .2s; }
.nav:hover { opacity: 1; }
.nav:focus-visible, .ctl:focus-visible, .start:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.nav[disabled] { opacity: .15; cursor: default; }
.nav img { display: block; width: 50px; height: auto; }
.nav.prev:hover:not([disabled]) { transform: translateX(-3px); }
.nav.next:hover:not([disabled]) { transform: translateX(3px); }
.page-wrap { height: 100%; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; height: min(100%, calc((100vw - 190px) * 0.75)); box-shadow: 0 14px 40px rgba(0,0,0,.55); background: var(--ground-2); overflow: hidden; }
.frame img.page { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s ease, transform .45s ease; }
.frame img.page.on { opacity: 1; transform: none; }
.frame img.page.from-right { transform: translateX(3%); }
.frame img.page.from-left { transform: translateX(-3%); }
.start { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; gap: 10px; background: rgba(29,15,12,.85); color: var(--ink); border: 1px solid var(--ember); padding: 10px 18px; font-family: var(--f-display); font-size: 1rem; cursor: pointer; }
.start img { width: 28px; height: auto; }
.start[hidden] { display: none !important; }
.foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.count { font-size: .85rem; letter-spacing: .14em; color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 4.5em; }
.dots { flex: 1; min-width: 100px; height: 4px; background: var(--line); position: relative; }
.dots i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ember); transition: width .35s ease; }
.ctls { display: flex; gap: 8px; flex-wrap: wrap; }
.ctl { background: none; border: 1px solid var(--line); color: var(--ink-dim); font-family: var(--f-display); font-size: .8rem; padding: 6px 12px; cursor: pointer; }
.ctl[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
@media (max-width: 560px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; padding: 10px 4px; background: rgba(29,15,12,.55); }
  .nav img { width: 34px; }
  .nav.prev { left: 0; } .nav.next { right: 0; }
  .nav.prev:hover:not([disabled]), .nav.next:hover:not([disabled]) { transform: translateY(-50%); }
  .frame { height: auto; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .frame img.page, .dots i, .nav { transition: none; } }
</style>
</head>
<body>
<div class="book">
  <div class="stage">
    <button class="nav prev" id="prev" aria-label="上一頁"><img src="images/left.jpg" alt=""></button>
    <div class="page-wrap">
      <div class="frame" id="frame">
        <button class="start" id="start" type="button"><img src="images/read.jpg" alt="">開始閱讀</button>
      </div>
    </div>
    <button class="nav next" id="next" aria-label="下一頁"><img src="images/right.jpg" alt=""></button>
  </div>
  <div class="foot">
    <span class="count" id="count">封面</span>
    <div class="dots" aria-hidden="true"><i id="bar"></i></div>
    <div class="ctls">
      <button class="ctl" id="musicBtn" type="button" aria-pressed="true">背景音樂</button>
      <button class="ctl" id="speechBtn" type="button" aria-pressed="true">旁白</button>
      <button class="ctl" id="autoBtn" type="button" aria-pressed="false">自動翻頁</button>
    </div>
  </div>
</div>

<script>
// 頁數依檔名 0–19。第 N 頁播放 audio/speech/N.mp3（旁白）與 audio/music/N.mp3（背景音樂）。
var TOTAL = 20;
var MUSIC_VOL = 0.35;

var cur = 0, started = false;
var musicOn = true, speechOn = true, autoOn = false;

var frame = document.getElementById("frame");
var count = document.getElementById("count");
var bar = document.getElementById("bar");
var prev = document.getElementById("prev");
var next = document.getElementById("next");
var start = document.getElementById("start");
var musicBtn = document.getElementById("musicBtn");
var speechBtn = document.getElementById("speechBtn");
var autoBtn = document.getElementById("autoBtn");

var speech = new Audio();
var music = new Audio();
music.loop = true;
music.volume = 0;
var fadeTimer = null;

function imgSrc(i) { return "images/p" + i + ".jpg"; }
function preload(i) { if (i >= 0 && i < TOTAL) { var im = new Image(); im.src = imgSrc(i); } }

function fadeMusic(to, ms, done) {
  clearInterval(fadeTimer);
  var from = music.volume, steps = Math.max(1, Math.round(ms / 40)), k = 0;
  fadeTimer = setInterval(function () {
    k++;
    music.volume = Math.min(1, Math.max(0, from + (to - from) * k / steps));
    if (k >= steps) { clearInterval(fadeTimer); if (done) done(); }
  }, 40);
}

function playAudioFor(i) {
  // 旁白
  speech.onended = null;
  speech.pause();
  if (speechOn) {
    speech.src = "audio/speech/" + i + ".mp3";
    speech.currentTime = 0;
    speech.play().catch(function () {});
    speech.onended = function () {
      if (autoOn && cur === i && i < TOTAL - 1) setTimeout(function () { if (cur === i) go(1); }, 900);
    };
  }
  else if (autoOn && i < TOTAL - 1) {
    // 旁白關閉時，自動翻頁改為每頁停留 10 秒
    setTimeout(function () { if (cur === i && autoOn && !speechOn) go(1); }, 10000);
  }
  // 背景音樂：淡出舊曲，再淡入新曲
  var src = "audio/music/" + i + ".mp3";
  fadeMusic(0, 350, function () {
    music.pause();
    music.src = src;
    music.currentTime = 0;
    if (musicOn) { music.play().catch(function () {}); fadeMusic(MUSIC_VOL, 700); }
  });
}

function show(i, dir) {
  if (i < 0 || i >= TOTAL) return;
  var old = frame.querySelector("img.page.on");
  var im = document.createElement("img");
  im.className = "page " + (dir > 0 ? "from-right" : dir < 0 ? "from-left" : "");
  im.alt = i === 0 ? "封面" : "第 " + i + " 頁";
  im.src = imgSrc(i);
  frame.insertBefore(im, frame.firstChild);
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    im.classList.add("on");
    if (old) { old.classList.remove("on"); setTimeout(function () { old.remove(); }, 500); }
  }); });
  cur = i;
  count.textContent = i === 0 ? "封面" : i + " / " + (TOTAL - 1);
  bar.style.width = (i / (TOTAL - 1) * 100) + "%";
  prev.disabled = i === 0;
  next.disabled = i === TOTAL - 1;
  preload(i + 1); preload(i - 1);
  if (started) playAudioFor(i);
}

function begin() {
  if (started) return;
  started = true;
  start.hidden = true;
  playAudioFor(cur);
}

function go(d) {
  // 第一次翻頁（尚未按開始）也視為使用者互動，開始播放
  if (!started) { started = true; start.hidden = true; }
  show(cur + d, d);
}

prev.addEventListener("click", function () { go(-1); });
next.addEventListener("click", function () { go(1); });
start.addEventListener("click", begin);
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1);
  else if (e.key === " " && !started) { e.preventDefault(); begin(); }
});

var sx = null;
frame.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
frame.addEventListener("touchend", function (e) {
  if (sx === null) return;
  var dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  sx = null;
});

musicBtn.addEventListener("click", function () {
  musicOn = !musicOn;
  musicBtn.setAttribute("aria-pressed", String(musicOn));
  if (!started) return;
  if (musicOn) { music.play().catch(function () {}); fadeMusic(MUSIC_VOL, 400); }
  else { fadeMusic(0, 300, function () { music.pause(); }); }
});
speechBtn.addEventListener("click", function () {
  speechOn = !speechOn;
  speechBtn.setAttribute("aria-pressed", String(speechOn));
  if (!started) return;
  if (speechOn) { playAudioFor(cur); } else { speech.onended = null; speech.pause(); }
});
autoBtn.addEventListener("click", function () {
  autoOn = !autoOn;
  autoBtn.setAttribute("aria-pressed", String(autoOn));
  if (autoOn && started && speech.ended && cur < TOTAL - 1) go(1);
});

show(0, 0);
</script>
</body>
</html>
